[project]
name = "nabavaradar-api"
version = "0.1.0"
description = "NabavaRadar: open public tenders ranked by company activity, and supplier-market sounding (API + ingestion CLI)"
requires-python = ">=3.12,<3.13"
license = { text = "EUPL-1.2" }
dependencies = [
  "opendata-core[semantic]",
  "pyyaml>=6",
]

[project.scripts]
nabavaradar = "nabavaradar_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabavaradar_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
  "live: hits the real network; skipped unless RUN_LIVE=1",
  "slow: slow test; run with -m slow",
  "db: needs PostgreSQL with pgvector; skipped unless TEST_DATABASE_URL is set",
]

[tool.uv.sources]
opendata-core = { workspace = true }
