    applies_to:
    - competition
    shape: list
    note: NUTS3 of performance (procedure level)
    sample:
    - HR035
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  place_nuts_lot:
    ted_field: place-of-performance-subdiv-lot
    applies_to:
    - competition
    - result
    shape: list
    note: NUTS3 per lot
    sample:
