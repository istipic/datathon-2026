# Mapping of our fields to TED field names. Samples are copied from saved real responses (data/evidence).
source: TED Search API v3 - POST https://api.ted.europa.eu/v3/notices/search (anonymous)
evidence:
- 2026-11-04_ted_api-v3.yaml
- 2026-11-04_ted_search_field_names.txt
- 2026-11-04_ted_search_competition_sample.json
- 2026-11-04_ted_search_result_sample.json
query:
  competition: buyer-country=HRV AND notice-type IN (cn-standard cn-social cn-desg) AND publication-date>={YYYYMMDD}
  result: buyer-country=HRV AND notice-type IN (can-standard can-social can-desg) AND publication-date>={YYYYMMDD}
  syntax:
    country: ISO alpha-3 (HRV)
    date: YYYYMMDD
  pagination:
    paginationMode: ITERATION
    limit_max: 250
    fields_per_page_max: 10000
    token_field: iterationNextToken
notes:
- 'Result notices published before about 2024-02 are legacy TED notices: the API returns no winner and no submissions
  fields for them (measured 2026-11-04).'
- Lists are flattened over lots/tenders; the alignment rules are implemented and tested in nabavaradar_api.ingest.ted_parse.
fields:
  pub_no:
    ted_field: publication-number
    applies_to:
    - competition
    - result
    shape: scalar
    note: Upsert key
    sample: 722712-2026
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  notice_type:
    ted_field: notice-type
    applies_to:
    - competition
    - result
    shape: scalar
    note: 'competition: cn-standard|cn-social|cn-desg; result: can-standard|can-social|can-desg'
    sample: cn-standard
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  pub_date:
    ted_field: publication-date
    applies_to:
    - competition
    - result
    shape: scalar
    note: '''YYYY-MM-DD+TZ'''
    sample: 2026-10-20+02:00
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  procedure_id:
    ted_field: procedure-identifier
    applies_to:
    - competition
    - result
    shape: scalar
    note: Links a result notice to its competition notice (same procedure UUID)
    sample: 28d7006f-d265-4431-8354-9eaa1c41091e
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  buyer_name:
    ted_field: buyer-name
    applies_to:
    - competition
    - result
    shape: multilingual-list
    note: '{lang: [names]}; first name of ''hrv'', else any language'
    sample:
      hrv:
      - KLINIČKI BOLNIČKI CENTAR SPLIT
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  buyer_country:
    ted_field: buyer-country
    applies_to:
    - competition
    - result
    shape: list
    note: ISO alpha-3; used in the query as buyer-country=HRV
    sample:
    - HRV
    sample_from: 2026-11-04_ted_search_competition_sample.json (publication 722712-2026)
  buyer_nuts:
    ted_field: buyer-country-sub
    applies_to:
    - competition
    - result
    shape: list
    note: NUTS code of the buyer
    sample:
