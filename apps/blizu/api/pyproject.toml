[project]
name = "blizu-api"
version = "0.1.0"
description = "Blizu: walking-time access to daily public services in Zagreb (API + ingestion CLI)"
requires-python = ">=3.12,<3.13"
license = { text = "EUPL-1.2" }
dependencies = [
  "opendata-core[graph]",
  "pyyaml>=6",
  "osmium>=4",  # Geofabrik-extract fallback when Overpass is unavailable (docs/adr/0005)
]

[project.optional-dependencies]
# semantic /search (downloads a ~470 MB model); without it /search uses a keyword fallback
semantic = ["opendata-core[semantic]"]

[project.scripts]
blizu = "blizu_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blizu_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
  "live: hits the real network; skipped unless RUN_LIVE=1",
  "slow: slow test; run with -m slow",
  "db: needs PostGIS; skipped unless TEST_DATABASE_URL is set",
]

[tool.uv.sources]
opendata-core = { workspace = true }
