[project]
name = "otporno-api"
version = "0.1.0"
description = "Otporko: Risk Passport for flood, heat and wildfire, and municipal exposure planning (API + ingestion CLI)"
requires-python = ">=3.12,<3.13"
license = { text = "EUPL-1.2" }
dependencies = [
  "opendata-core",
  "pyyaml>=6",
  "jinja2>=3",  # municipal brief template (P1)
  "osmium>=4",  # OSM extract fallback for cooling-centre candidates when Overpass is down (docs/adr/0007)
]

[project.scripts]
otporno = "otporno_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otporno_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
  "live: hits the real network; skipped unless RUN_LIVE=1",
  "slow: slow test; run with -m slow",
  "db: needs PostGIS; skipped unless TEST_DATABASE_URL is set",
]

[tool.uv.sources]
opendata-core = { workspace = true }
